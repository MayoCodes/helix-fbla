<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kitchen</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="tutorial-popup.css?v=4" />
        <script src="tutorial-popup.js?v=4"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
        <script>
            const firebaseConfig = {
                apiKey: "AIzaSyAihB6sYRLLfVOqupIxn5NJWLHzaA8tJRo",
                authDomain: "helix-fbla.firebaseapp.com",
                projectId: "helix-fbla",
                storageBucket: "helix-fbla.firebasestorage.app",
                messagingSenderId: "154951525413",
                appId: "1:154951525413:web:3fa89cc765fcec9cf0cbcc",
            };
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();

            function showLoading(message = "Loading...") {
                let overlay = document.getElementById("loadingOverlay");
                if (!overlay) {
                    overlay = document.createElement("div");
                    overlay.id = "loadingOverlay";
                    overlay.style.cssText = `
                        position: fixed; inset: 0; z-index: 99999;
                        display: flex; align-items: center; justify-content: center;
                        background: rgba(5, 11, 11, 0.85); color: white;
                        font: 600 15px "Plus Jakarta Sans", sans-serif;
                    `;
                    document.body.appendChild(overlay);
                }
                overlay.textContent = message;
                overlay.style.display = "flex";
            }

            function hideLoading() {
                const overlay = document.getElementById("loadingOverlay");
                if (overlay) overlay.style.display = "none";
            }
        </script>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    "Plus Jakarta Sans",
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                overflow: hidden;
                height: 100vh;
                width: 100vw;
            }

            .kitchen {
                position: relative;
                width: 100%;
                height: 100%;
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
                transform-origin: center center;
            }

            .kitchen.dog {
                background-image: url("dog_kitchen.png");
            }

            .kitchen.cat {
                background-image: url("cat_kitchen.png");
            }

            .kitchen.bird {
                background-image: url("bird_kitchen.png");
            }

            /* Zoom focus classes — stronger exponential zoom toward each dish */
            .kitchen.focus-left {
                transform: scale(1.28) translate(6%, 2%);
            }

            .kitchen.focus-center {
                transform: scale(1.28) translate(0%, 2%);
            }

            .kitchen.focus-right {
                transform: scale(1.28) translate(-6%, 2%);
            }

            .overlay {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.08) 0%,
                    rgba(0, 0, 0, 0) 40%,
                    rgba(0, 0, 0, 0.15) 100%
                );
                pointer-events: none;
            }

            .overlay::after {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient(
                    circle at center,
                    rgba(0, 0, 0, 0) 22%,
                    rgba(0, 0, 0, 0.82) 100%
                );
                opacity: 0;
                transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
                pointer-events: none;
            }

            .kitchen.focus-left .overlay::after,
            .kitchen.focus-center .overlay::after,
            .kitchen.focus-right .overlay::after {
                opacity: 1;
            }

            .dishes-layer {
                position: absolute;
                inset: 0;
                z-index: 5;
            }

            .dish-region {
                position: absolute;
                width: 150px;
                height: 150px;
                border-radius: 50%;
                cursor: pointer;
                display: flex;
                align-items: flex-end;
                justify-content: center;
            }

            /* Position the three hover zones over the dishes */
            .dish-region.left {
                left: 21%;
                top: 59%;
            }

            .dish-region.center {
                left: 44.5%;
                top: 59%;
            }

            .dish-region.right {
                left: 68.5%;
                top: 59%;
            }

            /* Subtle highlight ring that appears on hover */
            .dish-region::before {
                content: "";
                position: absolute;
                inset: 0;
                border-radius: 50%;
                border: 3px solid rgba(255, 255, 255, 0.7);
                box-shadow:
                    0 0 0 8px rgba(255, 255, 255, 0.15),
                    0 12px 40px rgba(0, 0, 0, 0.25);
                opacity: 0;
                transform: scale(0.85);
                transition:
                    opacity 0.5s ease,
                    transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            }

            .dish-region:hover::before {
                opacity: 1;
                transform: scale(1);
            }

            /* Branching line segments extending from top of each circle */
            .dish-path {
                position: absolute;
                bottom: 50%;
                left: 50%;
                width: 250px;
                height: 320px;
                pointer-events: none;
                overflow: visible;
                z-index: -1;
            }

            .dish-path svg {
                width: 100%;
                height: 100%;
                overflow: visible;
            }

            .dish-path path {
                fill: none;
                stroke: rgba(255, 255, 255, 0.85);
                stroke-width: 3;
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-dasharray: 500;
                stroke-dashoffset: 500;
                transition: stroke-dashoffset 0.8s linear;
            }

            .dish-path circle {
                opacity: 0;
                transition: opacity 0.15s ease;
            }

            .dish-region:hover .dish-path path {
                stroke-dashoffset: 0;
            }

            .dish-region:hover .dish-path circle {
                opacity: 1;
            }

            .dish-region:hover .dish-path circle:nth-of-type(1) {
                transition-delay: 0s;
            }

            .dish-region:hover .dish-path circle:nth-of-type(2) {
                transition-delay: 0.32s;
            }

            .dish-region:hover .dish-path circle:nth-of-type(3) {
                transition-delay: 0.64s;
            }

            .point-box {
                position: absolute;
                width: 125px;
                height: 90px;
                background: rgba(255, 255, 255, 0.95);
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
                opacity: 0;
                transform: scale(0.8);
                transition:
                    opacity 0.25s ease,
                    transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 8px;
            }

            .point-box h4 {
                font-size: 13px;
                font-weight: 700;
                color: #1a1a1a;
                margin-bottom: 2px;
            }

            .point-box span {
                font-size: 11px;
                color: #2dd4bf;
                font-weight: 700;
            }

            .teal-num {
                color: #2dd4bf;
            }

            .dish-region:hover .point-box {
                opacity: 1;
                transform: scale(1);
            }

            .dish-region:hover .point-box:nth-of-type(1) {
                transition-delay: 0s;
            }

            .dish-region:hover .point-box:nth-of-type(2) {
                transition-delay: 0.32s;
            }

            .dish-region:hover .point-box:nth-of-type(3) {
                transition-delay: 0.64s;
            }

            .dish-path.left-path {
                transform: translateX(-100%) translateY(-2px);
            }

            .dish-path.right-path {
                transform: translateX(0%) translateY(-2px);
            }

            .dish-label {
                position: relative;
                z-index: 2;
                color: #fff;
                font-size: 13px;
                font-weight: 800;
                text-shadow:
                    0 1px 2px rgba(0, 0, 0, 0.45),
                    0 2px 6px rgba(0, 0, 0, 0.35);
                pointer-events: none;
                margin-bottom: 14px;
                letter-spacing: 0.2px;
            }

            .back-btn {
                position: absolute;
                top: 24px;
                left: 24px;
                background: rgba(255, 255, 255, 0.92);
                border: none;
                padding: 12px 20px;
                border-radius: 12px;
                font-family: inherit;
                font-weight: 700;
                font-size: 14px;
                cursor: pointer;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
                transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease;
                z-index: 10;
            }

            .back-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
            }

            .tutorial-btn {
                position: absolute;
                bottom: 24px;
                left: 24px;
                background: #00b3a6;
                color: white;
                border: none;
                border-radius: 18px;
                padding: 10px 16px;
                font-size: 12px;
                font-weight: 700;
                cursor: pointer;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
                transition:
                    transform 0.2s,
                    box-shadow 0.2s;
                z-index: 10;
            }

            .tutorial-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
            }

            .pet-label {
                position: absolute;
                top: 24px;
                right: 24px;
                background: rgba(255, 255, 255, 0.92);
                padding: 10px 18px;
                border-radius: 20px;
                font-size: 13px;
                font-weight: 700;
                text-transform: capitalize;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
                z-index: 10;
            }

            @media (max-width: 768px) {
                .dish-region {
                    width: 110px;
                    height: 110px;
                }

                .dish-region.left {
                    left: 21%;
                    top: 62%;
                }

                .dish-region.center {
                    left: 49.5%;
                    top: 62%;
                }

                .dish-region.right {
                    left: 78.5%;
                    top: 62%;
                }

                .pet-label {
                    font-size: 11px;
                    margin-bottom: 10px;
                }
            }

            /* ── LEFT CARD STACK (vitals + menu) ── */
            .left-card-stack {
                position: fixed;
                left: 24px;
                top: 50%;
                transform: translateY(-50%);
                z-index: 100;
                width: 280px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .profile-mini-card {
                background: rgba(245, 245, 245, 0.96);
                backdrop-filter: blur(20px);
                border-radius: 20px;
                padding: 12px 16px;
                display: flex;
                align-items: center;
                gap: 12px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .pmc-avatar {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                overflow: hidden;
                border: 2px solid #e91e63;
                flex-shrink: 0;
            }
            .pmc-avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .pmc-info {
                flex: 1;
                min-width: 0;
            }
            .pmc-name {
                font-size: 1rem;
                font-weight: 800;
                color: #1a1a1a;
                font-family: "Inter", sans-serif;
                line-height: 1.2;
            }
            .pmc-sub {
                font-size: 0.72rem;
                color: #888;
                font-weight: 600;
                font-family: "Inter", sans-serif;
                display: flex;
                align-items: center;
                gap: 4px;
                margin-top: 2px;
            }
            .pmc-coins {
                font-size: 0.95rem;
                font-weight: 800;
                color: #f4a020;
                font-family: "Inter", sans-serif;
            }

            .vitals-card {
                background: rgba(245, 245, 245, 0.96);
                backdrop-filter: blur(20px);
                border-radius: 24px;
                padding: 20px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .vitals-header {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                margin-bottom: 4px;
            }
            .vitals-name {
                font-size: 1.15rem;
                font-weight: 800;
                color: #1a1a1a;
                font-family: "Inter", sans-serif;
                cursor: pointer;
            }
            .vitals-sub {
                font-size: 0.6rem;
                font-weight: 700;
                color: #aaa;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                font-family: "Inter", sans-serif;
                margin-bottom: 20px;
            }
            .vitals-rings {
                display: flex;
                align-items: center;
                justify-content: center;
                position: relative;
                width: 180px;
                height: 180px;
                margin: 0 auto 16px;
            }
            .vitals-rings svg {
                transform: rotate(-90deg);
            }
            .vitals-center {
                position: absolute;
                width: 56px;
                height: 56px;
                border-radius: 50%;
                background: #fff;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
            }
            .vitals-center svg {
                width: 24px;
                height: 24px;
                transform: none;
                color: #e91e63;
            }
            .vitals-footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 4px;
            }
            .vitals-footer-label {
                font-size: 0.75rem;
                font-weight: 700;
                color: #e91e63;
                font-family: "Inter", sans-serif;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .vitals-footer-label::before {
                content: "";
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #e91e63;
            }
            .vitals-footer-pct {
                font-family: "Inter", sans-serif;
                font-weight: 800;
                font-size: 0.95rem;
                color: #1a1a1a;
            }
            .vitals-stats-row {
                display: flex;
                justify-content: space-between;
                gap: 8px;
                margin-top: 16px;
                padding-top: 14px;
                border-top: 1px solid rgba(0, 0, 0, 0.06);
            }
            .vitals-stat {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                flex: 1;
            }
            .vitals-stat-val {
                font-size: 1rem;
                font-weight: 800;
                color: #1a1a1a;
                font-family: "Inter", sans-serif;
            }
            .vitals-stat-lbl {
                font-size: 0.6rem;
                font-weight: 700;
                color: #999;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                font-family: "Inter", sans-serif;
            }

            /* Menu card */
            .menu-card {
                background: rgba(245, 245, 245, 0.96);
                backdrop-filter: blur(20px);
                border-radius: 24px;
                padding: 12px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .menu-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px 14px;
                border-radius: 14px;
                cursor: pointer;
                transition: all 0.2s;
                position: relative;
                border: none;
                background: transparent;
                width: 100%;
                text-align: left;
            }
            .menu-item:hover {
                background: rgba(0, 0, 0, 0.04);
            }
            .menu-item-icon {
                width: 20px;
                height: 20px;
                color: #666;
                flex-shrink: 0;
            }
            .menu-item-label {
                font-size: 0.85rem;
                font-weight: 600;
                color: #555;
                font-family: "Inter", sans-serif;
                flex: 1;
            }

            @media (max-width: 1200px) {
                .left-card-stack {
                    width: 240px;
                }
                .vitals-rings {
                    width: 140px;
                    height: 140px;
                }
                .vitals-rings svg {
                    width: 140px;
                    height: 140px;
                }
                .vitals-center {
                    width: 44px;
                    height: 44px;
                }
                .vitals-center svg {
                    width: 18px;
                    height: 18px;
                }
                .vitals-card {
                    padding: 16px;
                }
            }
            @media (max-width: 900px) {
                .left-card-stack {
                    left: 16px;
                    width: 200px;
                    gap: 8px;
                }
                .profile-mini-card {
                    padding: 10px 12px;
                    gap: 10px;
                }
                .pmc-avatar {
                    width: 36px;
                    height: 36px;
                }
                .pmc-name {
                    font-size: 0.85rem;
                }
                .pmc-coins {
                    font-size: 0.8rem;
                }
                .vitals-card {
                    padding: 12px;
                    border-radius: 18px;
                }
                .vitals-rings {
                    width: 110px;
                    height: 110px;
                }
                .vitals-rings svg {
                    width: 110px;
                    height: 110px;
                }
                .vitals-center {
                    width: 36px;
                    height: 36px;
                }
                .vitals-center svg {
                    width: 16px;
                    height: 16px;
                }
                .vitals-stats-row {
                    margin-top: 12px;
                    padding-top: 10px;
                }
                .vitals-stat-val {
                    font-size: 0.85rem;
                }
                .vitals-stat-lbl {
                    font-size: 0.55rem;
                }
                .menu-card {
                    padding: 8px;
                    gap: 4px;
                }
                .menu-item {
                    padding: 10px 12px;
                    gap: 10px;
                }
                .menu-item-icon {
                    width: 16px;
                    height: 16px;
                }
                .menu-item-label {
                    font-size: 0.78rem;
                }
            }
            @media (max-width: 768px) {
                .left-card-stack {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <!-- LEFT CARD STACK -->
        <div class="left-card-stack">
            <!-- Profile mini card -->
            <div class="profile-mini-card">
                <div class="pmc-avatar">
                    <img
                        src="https://i.pravatar.cc/150?img=12"
                        alt="avatar"
                        id="kitchenAvatar"
                    />
                </div>
                <div class="pmc-info">

                    <div class="pmc-sub">

            <!-- Vitals card -->

                    <div class="vitals-name" id="kitchenVitalsName">Pet</div>
                </div>
                <div class="vitals-sub">VITALS SYNC</div>

                <div class="vitals-rings">
                    <svg width="180" height="180" viewBox="0 0 180 180">
                        <!-- Outermost ring (Health - pink) -->

                            cx="90"
                            cy="90"

                            fill="none"

                    <div class="vitals-center">

                    <div class="vitals-stat">

        <script>
            const foodData = {
                dog: {
                    label: "Dog Kitchen",
                    dishes: [
                        {

                            description:
                                "A classic seed mix that parrots love to crack.",
                        },
                        {

                            cost: "$3",
                            effect: "+60 Fullness<br>+30 Happiness",
                            description:
                                "A protein-packed variety of healthy nuts.",
                        },
                        {
                            name: "Millets",
                            cost: "$2",
                            effect: "+30 Fullness<br>+60 Happiness",
                            description:
                                "Natural millet sprigs for pecking and foraging fun.",
                        },
                    ],
                },
            };

            function getPetType() {
                /* First: check URL param */
                const params = new URLSearchParams(window.location.search);
                const pet = params.get("pet");
                if (pet && foodData[pet]) return pet;

                /* Second: check shared navbar's current pet */
                if (window.helixNav && window.helixNav.currentPetId) {
                    const pets = window.helixNav.userPets || {};
                    const currentPet = pets[window.helixNav.currentPetId];
                    if (currentPet && currentPet.type) {
                        const typeMap = { a: "cat", b: "dog", c: "bird" };
                        const mapped = typeMap[currentPet.type];
                        if (mapped && foodData[mapped]) return mapped;
                    }
                }

                /* Third: fall back to localStorage */
                const saved = localStorage.getItem("helix-pet-type");
                if (saved && foodData[saved]) return saved;

                /* Default: dog */
                return "dog";
            }

            function tealNumbers(text) {
                return text.replace(
                    /(\d+)/g,
                    '<span class="teal-num">$1</span>',
                );
            }

            /* Pet type names and icons */
            const PET_TYPE_NAMES = {
                a: "Cat",
                b: "Dog",
                c: "Bird",
            };

            const PET_TYPE_ICONS = {
                a: '<svg viewBox="0 0 24 24" fill="none" stroke="#00acc1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.5C21 17.9 16.97 21 12 21s-9-3-9-7.5c0-1.26.43-2.43 1-3.5 0 0-1.82-6.42-.42-7C4.57 2.43 7.82 3.27 9.6 5.26c.65-.17 1.33-.26 2-.26z"/></svg>',
                b: '<svg viewBox="0 0 24 24" fill="none" stroke="#00acc1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>',
                c: '<svg viewBox="0 0 24 24" fill="none" stroke="#00acc1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h.01"/><path d="M3.4 18H12a8 8 0 0 0 9-8.5c0-3.5-2.5-7-7-7-3.5 0-6 2.5-6 6 0 1.5.5 2.5 1.5 3.5L6 18h.5"/><path d="M9 18a3.5 3.5 0 0 0 6 0"/></svg>',
            };

            /* Money belongs to the signed-in account, never to an individual pet. */
            let accountCostTracking = { budgetRemaining: 500 };

            function renderKitchen() {
                const pet = getPetType();
                const kitchen = document.getElementById("kitchen");
                const label = document.getElementById("pet-label");
                const data = foodData[pet];

                kitchen.className = "kitchen " + pet;
                label.textContent = data.label;

                data.dishes.forEach((dish, index) => {
                    const nameEl = document.getElementById(
                        "dish-name-" + index,
                    );
                    const costEl = document.getElementById(
                        "dish-cost-" + index,
                    );
                    const descEl = document.getElementById(
                        "dish-desc-" + index,
                    );
                    if (nameEl) nameEl.textContent = dish.name;
                    if (costEl) costEl.textContent = dish.cost;
                    if (descEl) descEl.textContent = dish.description;

                    const pbName = document.getElementById("pb-name-" + index);
                    const pbCost = document.getElementById("pb-cost-" + index);
                    const pbEffect = document.getElementById(
                        "pb-effect-" + index,
                    );
                    if (pbName) pbName.textContent = dish.name;
                    if (pbCost) pbCost.innerHTML = tealNumbers(dish.cost);
                    if (pbEffect) pbEffect.innerHTML = tealNumbers(dish.effect);
                });
            }

            function setupHover() {
                const kitchen = document.getElementById("kitchen");
                const regions = document.querySelectorAll(".dish-region");

                regions.forEach((region) => {
                    const focusClass = region.dataset.focus;
                    const index = parseInt(region.dataset.index);

                    region.addEventListener("mouseenter", () => {
                        kitchen.classList.add(focusClass);
                    });

                    region.addEventListener("mouseleave", () => {
                        kitchen.classList.remove(focusClass);
                    });

                    /* Click to buy the dish */
                    region.addEventListener("click", () => {
                        buyDish(index);
                    });
                });
            }

            async function buyDish(index) {
                /* Get current pet's data */
                let pet = null;
                let petId = null;
                let uid = null;

                if (
                    typeof helixNav !== "undefined" &&
                    helixNav.currentPetId &&
                    helixNav.userPets
                ) {
                    petId = helixNav.currentPetId;
                    pet = helixNav.userPets[petId];
                }

                if (!pet) {
                    showAlert("error", "No pet selected!");
                    return;
                }

                /* Get current user from Firebase */
                if (
                    typeof firebase !== "undefined" &&
                    firebase.auth().currentUser
                ) {
                    uid = firebase.auth().currentUser.uid;
                }

                if (!uid) {
                    showAlert("error", "Please sign in first!");
                    return;
                }

                /* Get the food data for this pet type */
                const petType = getPetType();
                const data = foodData[petType];
                if (!data || !data.dishes[index]) {
                    showAlert("error", "Dish not found!");
                    return;
                }

                const dish = data.dishes[index];
                const cost = parseInt(dish.cost.replace("$", ""));

                /* Always read the shared account budget from the user document. */
                let storedCostTracking;
                try {
                    const userDoc = await db.collection("users").doc(uid).get();
                    storedCostTracking =
                        userDoc.data()?.userData?.costTracking || {};
                    accountCostTracking = storedCostTracking;
                } catch (e) {
                    console.error("Unable to load account budget:", e);
                    showAlert("error", "Unable to load your account balance.");
                    return;
                }
                const currentBudget =
                    storedCostTracking.budgetRemaining ?? 500;

                if (currentBudget < cost) {
                    showAlert(
                        "error",
                        `Not enough coins! Need $${cost}, have $${currentBudget}.`,
                    );
                    return;
                }

                /* Parse effects from dish.effect */
                let fullnessBoost = 0;
                let happinessBoost = 0;
                const effectStr = dish.effect.replace(/<br\s*\/?>/gi, ", ");
                const fullnessMatch = effectStr.match(/\+\s*(\d+)\s*Fullness/);
                const happinessMatch = effectStr.match(
                    /\+\s*(\d+)\s*Happiness/,
                );
                if (fullnessMatch) fullnessBoost = parseInt(fullnessMatch[1]);
                if (happinessMatch)
                    happinessBoost = parseInt(happinessMatch[1]);

                /* Apply stat changes */
                const updates = {
                    fullness: Math.min(
                        100,
                        (pet.fullness || 0) + fullnessBoost,
                    ),
                    happiness: Math.min(
                        100,
                        (pet.happiness || 0) + happinessBoost,
                    ),
                };

                const newBudget = currentBudget - cost;

                /* Save to database */
                try {
                    showLoading("Buying " + dish.name + "...");

                    /* Update pet stats */
                    await db
                        .collection("users")
                        .doc(uid)
                        .collection("pets")
                        .doc(petId)
                        .update(updates);

                    /* Update budget in user doc */
                    await db
                        .collection("users")
                        .doc(uid)
                        .set(
                            {
                                userData: {
                                    costTracking: {
                                        ...storedCostTracking,
                                        budgetRemaining: newBudget,
                                        foodSpent:
                                            (storedCostTracking.foodSpent || 0) +
                                            cost,
                                    },
                                },
                            },
                            { merge: true },
                        );

                    /* Update local state */
                    Object.assign(pet, updates);
                    accountCostTracking = {
                        ...storedCostTracking,
                        budgetRemaining: newBudget,
                        foodSpent: (storedCostTracking.foodSpent || 0) + cost,
                    };

                    /* Update the pet in helixNav's userPets cache */
                    if (
                        typeof helixNav !== "undefined" &&
                        helixNav.userPets &&
                        helixNav.userPets[petId]
                    ) {
                        Object.assign(helixNav.userPets[petId], updates);
                    }

                    /* Refresh UI */
                    if (typeof renderKitchen === "function") renderKitchen();
                    if (typeof updateKitchenVitals === "function")
                        updateKitchenVitals();

                    /* Refresh navbar */
                    if (typeof helixNav !== "undefined") helixNav.refresh();

                    hideLoading();
                } catch (e) {
                    console.error("Kitchen buy error:", e);
                    hideLoading();
                    showAlert("error", `Error: ${e.message}`);
                }
            }

            function showAlert(type, msg) {
                /* Simple alert — can be enhanced later */
                const icons = {
                    success: "✅",
                    error: "❌",
                    warning: "⚠️",
                    info: "ℹ️",
                };
                alert((icons[type] || "") + " " + msg);
            }

            function goBack() {
                window.history.back();
            }

            renderKitchen();
            setupHover();

            /* ── VITALS OVERLAY (live from database) ── */
            function updateKitchenVitals() {
                /* Get current pet from navbar */
                let pet = null;
                if (
                    typeof helixNav !== "undefined" &&
                    helixNav.currentPetId &&
                    helixNav.userPets
                ) {
                    pet = helixNav.userPets[helixNav.currentPetId];
                }

                if (!pet) {
                    /* Fallback to localStorage pet type */
                    const petType = getPetType();
                    document.getElementById("kitchenVitalsName").textContent =
                        petType.charAt(0).toUpperCase() + petType.slice(1);
                    return;
                }

                const hp = Math.round(pet.health || 100);
                const nrg = Math.round(pet.energy || 100);
                const fd = Math.round(pet.fullness || 100);
                const joy = Math.round(pet.happiness || 100);

                /* Update name (Google account) and level */
                /* Get Google user from navbar */
                const googleUser =
                    (typeof helixNav !== "undefined" &&
                        helixNav._auth &&
                        helixNav._auth.currentUser) ||
                    (typeof firebase !== "undefined" &&
                        firebase.auth().currentUser) ||
                    null;
                if (googleUser) {
                    document.getElementById("kitchenName").textContent =
                        googleUser.displayName || "Trainer";
                    const avatarImg = document.getElementById("kitchenAvatar");
                    if (avatarImg && googleUser.photoURL) {
                        avatarImg.src = googleUser.photoURL;
                    }
                } else {
                    document.getElementById("kitchenName").textContent =
                        pet.name || "Pet";
                }
                document.getElementById("kitchenLevel").textContent =
                    `Lv. ${pet.level || 1} · ${(PET_TYPE_NAMES && PET_TYPE_NAMES[pet.type]) || getPetType().charAt(0).toUpperCase() + getPetType().slice(1)}`;
                document.getElementById("kitchenVitalsName").textContent =
                    pet.name || "Pet";

                /* Update coins (budgetRemaining) */
                const coins = accountCostTracking.budgetRemaining ?? 0;
                document.getElementById("kitchenCoins").textContent =
                    `$${Math.max(0, coins)}`;

                /* Update stat values */
                document.getElementById("kitchenHp").textContent = hp;
                document.getElementById("kitchenNrg").textContent = nrg;
                document.getElementById("kitchenFd").textContent = fd;
                document.getElementById("kitchenJoy").textContent = joy;

                /* Update rings (circumference = 2 * PI * r) */
                const hpCirc = 2 * Math.PI * 85; /* ~534 */
                const nrgCirc = 2 * Math.PI * 70; /* ~440 */
                const fdCirc = 2 * Math.PI * 55; /* ~346 */
                const joyCirc = 2 * Math.PI * 40; /* ~251 */
                document.getElementById(
                    "kitchenRingHp",
                ).style.strokeDashoffset = hpCirc - (hpCirc * hp) / 100;
                document.getElementById(
                    "kitchenRingNrg",
                ).style.strokeDashoffset = nrgCirc - (nrgCirc * nrg) / 100;
                document.getElementById(
                    "kitchenRingFd",
                ).style.strokeDashoffset = fdCirc - (fdCirc * fd) / 100;
                document.getElementById(
                    "kitchenRingJoy",
                ).style.strokeDashoffset = joyCirc - (joyCirc * joy) / 100;

                /* Update overall health percentage */
                const avg = Math.round((hp + nrg + fd + joy) / 4);
                document.getElementById("kitchenVitalsPct").textContent =
                    `${avg}%`;
            }

            /* Update vitals when DOM is ready and when navbar updates */
            document.addEventListener("DOMContentLoaded", () => {
                updateKitchenVitals();
                firebase.auth().onAuthStateChanged((user) => {
                    if (!user) return;
                    db.collection("users")
                        .doc(user.uid)
                        .onSnapshot((doc) => {
                            accountCostTracking =
                                doc.data()?.userData?.costTracking ||
                                accountCostTracking;
                            updateKitchenVitals();
                        });
                });
                /* Refresh every 2 seconds to catch database changes */
                setInterval(updateKitchenVitals, 2000);
            });
        </script>
