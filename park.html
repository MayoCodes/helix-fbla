<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Park — Helix</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&family=Inter:wght@400;600;700;800&display=swap"
            rel="stylesheet"
        />
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
        <style>
            :root {
                --teal: #49a6a6;
                --teal-dk: #2d7a7a;
                --teal-lt: #7fcece;
                --white: #fff;
                --glass: rgba(8, 28, 28, 0.65);
                --glass-h: rgba(73, 166, 166, 0.22);
                --yellow: #f4c430;
                --red: #e05252;
                --green: #4caf50;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 100vw;
                height: 100vh;
                overflow: hidden;
                font-family: "Nunito", sans-serif;
                background: #0a1f0a;
                user-select: none;
            }

            /* Background */
            .park-bg {
                position: fixed;
                inset: 0;
                width: 100vw;
                height: 100vh;
                background: url("park.png") center/cover no-repeat;
                z-index: 0;
            }
            .park-bg::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.25) 0%,
                    rgba(0, 0, 0, 0.1) 50%,
                    rgba(0, 0, 0, 0.35) 100%
                );
            }

            /* ── TOP-LEFT PROFILE ── */
            .yeap-top-left {
                position: fixed;
                top: 24px;
                left: 24px;
                z-index: 100;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .yeap-avatar-wrap {
                position: relative;
            }
            .yeap-avatar {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                background: #333;
                overflow: hidden;
                border: 2px solid rgba(255, 255, 255, 0.2);
            }
            .yeap-avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .yeap-level-badge {
                position: absolute;
                bottom: -6px;
                left: 0;
                background: #00d2ff;
                color: #000;
                font-size: 0.6rem;
                font-weight: 800;
                padding: 2px 6px;
                border-radius: 4px;
                font-family: "Inter", sans-serif;
            }
            .yeap-profile-info {
                display: flex;
                flex-direction: column;
            }
            .yeap-profile-sub {
                font-size: 0.65rem;
                font-weight: 700;
                color: #4ecdc4;
                text-transform: uppercase;
                letter-spacing: 1px;
                font-family: "Inter", sans-serif;
            }
            .yeap-profile-name {
                font-size: 1.1rem;
                font-weight: 800;
                color: #fff;
                letter-spacing: 0.5px;
                font-family: "Inter", sans-serif;
            }

            /* ── TOP-RIGHT RESOURCES ── */
            .yeap-top-right {
                position: fixed;
                top: 24px;
                right: 24px;
                z-index: 100;
                display: flex;
                gap: 12px;
            }
            .yeap-resource-pill {
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(12px);
                border-radius: 12px;
                padding: 10px 16px;
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                min-width: 100px;
            }
            .yeap-resource-label {
                font-size: 0.6rem;
                font-weight: 700;
                color: rgba(255, 255, 255, 0.5);
                text-transform: uppercase;
                letter-spacing: 1px;
                font-family: "Inter", sans-serif;
            }
            .yeap-resource-value {
                font-size: 1rem;
                font-weight: 700;
                color: #fff;
                font-family: "Inter", sans-serif;
            }
            .yeap-xp-pill {
                min-width: 240px;
                align-items: stretch;
            }
            .yeap-xp-pill .xp-bar-header {
                width: 100%;
            }

            /* ── LEFT CARD STACK ── */
            .left-card-stack {
                position: fixed;
                left: 24px;
                top: 50%;
                transform: translateY(-50%);
                z-index: 100;
                width: 280px;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }
            .profile-mini-card {
                background: rgba(245, 245, 245, 0.96);
                backdrop-filter: blur(20px);
                border-radius: 20px;
                padding: 12px 16px;
                display: flex;
                align-items: center;
                gap: 12px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            }
            .pmc-avatar {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                overflow: hidden;
                border: 2px solid #e91e63;
                flex-shrink: 0;
            }
            .pmc-avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .pmc-info {
                flex: 1;
                min-width: 0;
            }
            .pmc-name {
                font-family: "Inter", sans-serif;
                font-weight: 800;
                font-size: 0.95rem;
                color: #1a1a1a;
                letter-spacing: -0.3px;
            }
            .pmc-sub {
                display: flex;
                align-items: center;
                gap: 4px;
                font-size: 0.72rem;
                color: #888;
                font-weight: 700;
                margin-top: 2px;
                font-family: "Inter", sans-serif;
            }
            .pmc-coins {
                font-family: "Inter", sans-serif;
                font-weight: 800;
                font-size: 0.9rem;
                color: #f4a020;
                flex-shrink: 0;
            }
            .vitals-card {
                background: rgba(245, 245, 245, 0.96);
                backdrop-filter: blur(20px);
                border-radius: 24px;
                padding: 18px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .vitals-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .vitals-name {
                font-family: "Inter", sans-serif;
                font-weight: 800;
                font-size: 1rem;
                color: #1a1a1a;
                cursor: pointer;
            }
            .vitals-menu-btn {
                width: 28px;
                height: 28px;
                border-radius: 8px;
                border: none;
                background: rgba(0, 0, 0, 0.05);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #666;
                transition: background 0.2s;
            }
            .vitals-menu-btn:hover {
                background: rgba(0, 0, 0, 0.1);
            }
            .vitals-sub {
                font-size: 0.6rem;
                font-weight: 800;
                color: #aaa;
                letter-spacing: 2px;
                font-family: "Inter", sans-serif;
            }
            .vitals-rings {
                position: relative;
                width: 180px;
                height: 180px;
                margin: 0 auto;
            }
            .vitals-rings svg {
                transform: rotate(-90deg);
            }
            .vitals-center {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 44px;
                height: 44px;
                background: #fff;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
                color: #ff5a7e;
            }
            .vitals-center svg {
                width: 22px;
                height: 22px;
                transform: none;
            }
            .vitals-footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-top: 4px;
            }
            .vitals-footer-label {
                font-size: 0.75rem;
                font-weight: 700;
                color: #ff5a7e;
                font-family: "Inter", sans-serif;
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .vitals-footer-label::before {
                content: "";
                width: 6px;
                height: 6px;
                background: #ff5a7e;
                border-radius: 50%;
                display: inline-block;
            }
            .vitals-footer-pct {
                font-family: "Inter", sans-serif;
                font-weight: 800;
                font-size: 0.85rem;
                color: #333;
            }
            .vitals-stats-row {
                display: flex;
                justify-content: space-between;
                margin-top: 6px;
                padding-top: 10px;
                border-top: 1px solid rgba(0, 0, 0, 0.06);
            }
            .vitals-stat {
                text-align: center;
                flex: 1;
            }
            .vitals-stat-val {
                font-family: "Inter", sans-serif;
                font-weight: 800;
                font-size: 0.85rem;
                color: #333;
            }
            .vitals-stat-lbl {
                font-size: 0.6rem;
                font-weight: 700;
                color: #aaa;
                margin-top: 2px;
                letter-spacing: 0.5px;
                font-family: "Inter", sans-serif;
            }
            .menu-card {
                background: rgba(245, 245, 245, 0.96);
                backdrop-filter: blur(20px);
                border-radius: 20px;
                padding: 10px;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .menu-item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px 12px;
                border-radius: 14px;
                border: none;
                background: transparent;
                cursor: pointer;
                transition: all 0.2s ease;
                font-family: "Nunito", sans-serif;
                font-weight: 700;
                font-size: 0.85rem;
                color: #666;
                text-decoration: none;
                position: relative;
            }
            .menu-item:hover {
                background: rgba(0, 0, 0, 0.04);
                color: #333;
            }
            .menu-item.active {
                background: rgba(255, 90, 126, 0.1);
                color: #ff5a7e;
            }
            .menu-item.active .menu-item-icon {
                color: #ff5a7e;
            }
            .menu-item.active .menu-item-label {
                color: #ff5a7e;
            }
            .menu-item-icon {
                width: 20px;
                height: 20px;
                color: #999;
                flex-shrink: 0;
            }
            .menu-item-icon svg {
                width: 100%;
                height: 100%;
            }
            .menu-item-label {
                flex: 1;
                text-align: left;
                font-size: 0.85rem;
                font-weight: 700;
            }
            .menu-item-dot {
                width: 8px;
                height: 8px;
                background: #ff5a7e;
                border-radius: 50%;
                flex-shrink: 0;
            }
            .expand-family-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                width: 100%;
                padding: 12px;
                margin-top: 4px;
                border-radius: 14px;
                border: none;
                background: linear-gradient(135deg, #26a69a, #2d7a7a);
                color: #fff;
                font-family: "Nunito", sans-serif;
                font-weight: 800;
                font-size: 0.85rem;
                cursor: pointer;
                transition: all 0.2s ease;
                box-shadow: 0 4px 12px rgba(38, 166, 154, 0.3);
            }
            .expand-family-btn:hover {
                transform: translateY(-1px);
                box-shadow: 0 6px 16px rgba(38, 166, 154, 0.4);
            }

            /* ── CENTER PET AREA ── */
            .park-center {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 50;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 320px;
                height: 320px;
            }
            .pet-idle-wrap {
                position: relative;
                width: 280px;
                height: 280px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: none;
                background-color: transparent;
                transition: opacity 0.3s ease;
            }
            .pet-idle-wrap.hidden {
                opacity: 0;
                pointer-events: none;
            }
            .paw-overlay {
                display: none !important;
            }
            .anim-overlay {
                position: fixed;
                inset: 0;
                z-index: 160;
                display: none;
                align-items: center;
                justify-content: center;
                background: transparent;
            }
            .anim-overlay.open {
                display: flex;
            }
            .sprite-animator {
                width: 200px;
                height: 200px;
                overflow: hidden;
                background: none;
                background-color: transparent;
                background-repeat: no-repeat;
                background-position: 0 0;
            }
            .pet-idle {
                width: 300px;
                height: 300px;
                overflow: visible;
                transform: translateX(-20px);
                background: none;
                background-color: transparent;
                background-repeat: no-repeat;
                background-position: 0 0;
                filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.3));
            }
            .pet-idle:not(.active) {
                display: none;
            }
            .pet-click-zone {
                position: absolute;
                inset: 20px;
                border: none;
                border-radius: 20px;
                cursor: pointer;
                background: transparent;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* ── RIGHT-SIDE PAW PRINT ── */
            .paw-print {
                position: fixed;
                right: 30px;
                top: 50%;
                transform: translateY(-50%);
                z-index: 100;
                width: 380px;
                height: 380px;
                pointer-events: none;
            }
            .paw-toe {
                position: absolute;
                width: 68px;
                height: 88px;
                background: var(--glass);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 50%;
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                display: flex;
                align-items: center;
                justify-content: center;
                pointer-events: auto;
                box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
                transition: all 0.2s ease;
                overflow: hidden;
            }
            .paw-toe:nth-child(1) {
                top: 30px;
                left: 0;
                transform: rotate(-25deg);
            }
            .paw-toe:nth-child(2) {
                top: 0;
                left: 45px;
                transform: rotate(-8deg);
            }
            .paw-toe:nth-child(3) {
                top: 0;
                right: 45px;
                transform: rotate(8deg);
            }
            .paw-toe:nth-child(4) {
                top: 30px;
                right: 0;
                transform: rotate(25deg);
            }
            .paw-toe:hover {
                background: var(--glass-h);
                border-color: rgba(73, 166, 166, 0.4);
                box-shadow: 0 10px 36px rgba(0, 0, 0, 0.35);
            }
            .paw-heel {
                position: absolute;
                bottom: 10px;
                left: 50%;
                transform: translateX(-50%);
                width: 100px;
                height: 80px;
                background: var(--glass);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 50%;
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
            }
            .paw-btn {
                width: 100%;
                height: 100%;
                border: none;
                background: transparent;
                cursor: pointer;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 2px;
                color: #fff;
                font-family: "Nunito", sans-serif;
                padding: 4px;
                border-radius: 50%;
            }
            .paw-btn-lbl {
                font-size: 0.65rem;
                font-weight: 800;
                color: var(--teal-lt);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                line-height: 1.2;
                text-align: center;
                text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            }
            .paw-btn-cost {
                font-size: 0.55rem;
                font-weight: 900;
                color: rgba(255, 255, 255, 0.5);
                letter-spacing: 0.5px;
            }
            .paw-toe-svg {
                pointer-events: all;
                cursor: pointer;
            }
            .paw-toe-svg ellipse,
            .paw-toe-svg path {
                transition:
                    fill 0.2s ease,
                    stroke 0.2s ease;
            }
            .paw-toe-svg:hover ellipse,
            .paw-toe-svg:hover path {
                fill: rgba(73, 166, 166, 0.35) !important;
                stroke: rgba(73, 166, 166, 0.5) !important;
            }
            .paw-toe-svg ellipse,
            .paw-toe-svg path {
                transition:
                    fill 0.2s ease,
                    stroke 0.2s ease;
            }
            .paw-toe-svg:hover ellipse,
            .paw-toe-svg:hover path {
                fill: rgba(73, 166, 166, 0.35) !important;
                stroke: rgba(73, 166, 166, 0.5) !important;
            }

            /* Sprite inside pet-center plays animation in-place */
            .pet-center-sprite {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 300px;
                height: 300px;
                transform: translate(-50%, -50%);
                overflow: hidden;
                background: none;
                background-color: transparent;
                background-repeat: no-repeat;
                background-position: 0 0;
                image-rendering: pixelated;
                image-rendering: crisp-edges;
                border-radius: 20px;
                display: none;
                z-index: 51;
            }
            .pet-center-sprite.active {
                display: block;
            }
            #petCenterSprite,
            #pawPetIdle,
            #animSprite {
                background-image: none;
            }

            /* ── XP BAR ── */
            .xp-bar-container {
                position: fixed;
                bottom: 100px;
                right: 24px;
                z-index: 100;
                width: 280px;
                background: rgba(0, 0, 0, 0.55);
                backdrop-filter: blur(16px);
                border-radius: 16px;
                padding: 14px 18px;
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            }
            .xp-bar-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 8px;
            }
            .xp-bar-label {
                font-family: "Inter", sans-serif;
                font-weight: 700;
                font-size: 0.7rem;
                color: rgba(255, 255, 255, 0.6);
                text-transform: uppercase;
                letter-spacing: 1px;
            }
            .xp-bar-value {
                font-family: "Inter", sans-serif;
                font-weight: 800;
                font-size: 0.85rem;
                color: #fff;
            }
            .xp-bar-track {
                width: 100%;
                height: 10px;
                background: rgba(255, 255, 255, 0.1);
                border-radius: 5px;
                overflow: hidden;
                position: relative;
            }
            .xp-bar-fill {
                height: 100%;
                background: #fff;
                border-radius: 5px;
                box-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
                position: relative;
            }
            .xp-bar-fill::after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.25),
                    transparent
                );
            }
            @keyframes xpShimmer {
                0% {
                    transform: translateX(-100%);
                }
                100% {
                    transform: translateX(100%);
                }
            }

            /* ── RESPONSIVE ── */
            @media (max-width: 1024px) {
                .left-card-stack {
                    width: 240px;
                }
                .park-center {
                    width: 280px;
                    height: 280px;
                }
                .xp-bar-container {
                    width: 220px;
                }
            }
            @media (max-width: 768px) {
                .left-card-stack {
                    display: none;
                }
                .yeap-top-left {
                    top: 12px;
                    left: 12px;
                }
                .yeap-top-right {
                    top: 12px;
                    right: 12px;
                }
                .park-center {
                    width: 240px;
                    height: 240px;
                }
                .pet-idle-wrap {
                    width: 240px;
                    height: 240px;
                }
                .pet-idle {
                    width: 240px;
                    height: 240px;
                    background: none;
                    background-color: transparent;
                }
                .pet-center-sprite {
                    width: 240px;
                    height: 240px;
                }
                .xp-bar-container {
                    width: calc(100vw - 48px);
                    right: 12px;
                    bottom: 90px;
                }
                .paw-print {
                    right: 12px;
                    width: 140px;
                    height: 200px;
                }
                .paw-toe {
                    width: 50px;
                    height: 65px;
                }
                .paw-toe:nth-child(1) {
                    top: 20px;
                    left: 0;
                    transform: rotate(-25deg);
                }
                .paw-toe:nth-child(2) {
                    top: 0;
                    left: 32px;
                    transform: rotate(-8deg);
                }
                .paw-toe:nth-child(3) {
                    top: 0;
                    right: 32px;
                    transform: rotate(8deg);
                }
                .paw-toe:nth-child(4) {
                    top: 20px;
                    right: 0;
                    transform: rotate(25deg);
                }
                .paw-heel {
                    width: 70px;
                    height: 55px;
                    bottom: 5px;
                }
                .paw-btn-lbl {
                    font-size: 0.55rem;
                }
                .paw-btn-cost {
                    font-size: 0.5rem;
                }
            }
        </style>
    </head>
    <body>
        <!-- Background -->
        <div class="park-bg"></div>

        <!-- TOP-RIGHT RESOURCES -->
        <div class="yeap-top-right">
            <div class="yeap-resource-pill yeap-xp-pill">
                <div class="xp-bar-header">
                    <span class="xp-bar-label">Bond / XP</span>
                    <span class="xp-bar-value" id="xpValue">Bond 0 · XP 0 / 100</span>
                </div>
                <div class="xp-bar-track">
                    <div class="xp-bar-fill" id="xpFill" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- LEFT CARD STACK -->
        <div class="left-card-stack">
            <div class="profile-mini-card">
                <div class="pmc-avatar">
                    <img
                        src="https://i.pravatar.cc/150?img=12"
                        alt="avatar"
                        id="pmcAvatar"
                    />
                </div>
                <div class="pmc-info">
                    <div class="pmc-name" id="pmcName">Trainer</div>
                    <div class="pmc-sub">
                        <svg
                            width="12"

                    energy: 25,
                    fullness: 3,
                    xp: 22,
                },
            };
            // ═══════════════════════════════════════════
            // DATA LOADING
            // ═══════════════════════════════════════════
            async function loadPetData() {
                if (!auth || !db) return;
                try {
                    await new Promise((resolve) => {
                        const unsub = auth.onAuthStateChanged((u) => {
                            currentUser = u;
                            unsub();
                            resolve();
                        });
                    });
                    if (!currentUser) return;

                    const userDoc = await db
                        .collection("users")
                        .doc(currentUser.uid)
                        .get();
                    if (userDoc.exists) {
                        const d = userDoc.data();
                        userProfileData = d;
                        currentPetId = d.currentPetId;
                        userData = d.userData || {
                            costTracking: {
                                budgetRemaining:
                                    d.coins || d.budgetRemaining || 0,
                            },
                        };
                        if (!userData.costTracking) {
                            userData.costTracking = { budgetRemaining: 0 };
                        }
                    }

                    const petsSnap = await db
                        .collection("users")
                        .doc(currentUser.uid)
                        .collection("pets")
                        .get();
                    userPets = {};
                    petsSnap.forEach((doc) => (userPets[doc.id] = doc.data()));

                    if (currentPetId && userPets[currentPetId]) {
                        petData = { ...petData, ...userPets[currentPetId] };
                    } else if (Object.keys(userPets).length > 0) {
                        currentPetId = Object.keys(userPets)[0];
                        petData = { ...petData, ...userPets[currentPetId] };
                    }

                    updateUI();
                    restartIdleSprite();
                } catch (e) {
                    console.error("loadPetData error:", e);
                }
            }

            async function savePetData() {
                if (!currentUser || !db || !currentPetId) return;
                try {
                    await db
                        .collection("users")
                        .doc(currentUser.uid)
                        .collection("pets")
                        .doc(currentPetId)
                        .set(petData, { merge: true });
                } catch (e) {
                    console.error("savePetData error:", e);
                }
            }

            function updatePawLabels() {
                const labels = PAW_LABELS[petData.type] || PAW_LABELS.b;
                document.querySelectorAll(".paw-toe-svg").forEach((toe) => {
                    const actionMatch = toe
                        .getAttribute("onclick")
                        ?.match(/playAnim\(['\"](\w+)['\"]\)/);
                    const action = actionMatch?.[1];
                    if (!action || !labels[action]) return;

                    const labelLines = Array.from(
                        toe.querySelectorAll('text[font-size="13"]'),
                    );
                    if (labelLines.length === 1) {
                        const secondLine = labelLines[0].cloneNode(false);
                        const firstY = parseFloat(
                            labelLines[0].getAttribute("y"),
                        );
                        secondLine.setAttribute("y", firstY + 15);
                        const energyLine = toe.querySelector(
                            'text[font-size="11"]',
                        );
                        toe.insertBefore(secondLine, energyLine);
                        labelLines.push(secondLine);
                    }

                    labelLines[0].textContent = labels[action][0];
                    labelLines[1].textContent = labels[action][1];

                    const energyLine = toe.querySelector(
                        'text[font-size="11"]',
                    );
                    if (energyLine) {
                        if (!energyLine.dataset.baseY) {
                            energyLine.dataset.baseY =
                                energyLine.getAttribute("y");
                        }
                        const baseY = parseFloat(energyLine.dataset.baseY);
                        energyLine.setAttribute(
                            "y",
                            baseY + (labels[action][1] ? 14 : 0),
                        );
                    }
                });
            }

            function updateUI() {
                const p = petData;
                const budgetRemaining = Math.max(
                    0,
                    userData.costTracking?.budgetRemaining || 0,
                );
                const displayName =
                    currentUser?.displayName ||
                    userProfileData.displayName ||
                    "Trainer";
                const photoURL =
                    currentUser?.photoURL || userProfileData.photoURL;

                document.getElementById("pmcName").textContent = displayName;
                document.getElementById("pmcCoins").textContent =
                    "$" + budgetRemaining;
                if (photoURL) {
                    document.getElementById("pmcAvatar").src = photoURL;
                }
                document.getElementById("vitalsPetName").textContent =
                    p.name || "Pet";
                document.getElementById("pmcSub").textContent =
                    "Lv. " +
                    (p.level || 1) +
                    " · " +
                    (PET_TRAITS[p.type]?.name || "Pet");
                const hp = p.health || 0,
                    fd = p.fullness || 0,
                    joy = p.happiness || 0,
                    nrg = p.energy || 0;
                document.getElementById("vRingHp").style.strokeDashoffset =
                    534 - (534 * hp) / 100;
                document.getElementById("vRingNrg").style.strokeDashoffset =
                    440 - (440 * nrg) / 100;
                document.getElementById("vRingFd").style.strokeDashoffset =
                    346 - (346 * fd) / 100;
                document.getElementById("vRingJoy").style.strokeDashoffset =
                    251 - (251 * joy) / 100;
                document.getElementById("vitalsHp").textContent =
                    Math.round(hp);
                document.getElementById("vitalsNrg").textContent =
                    Math.round(nrg);
                document.getElementById("vitalsFd").textContent =
                    Math.round(fd);
                document.getElementById("vitalsJoy").textContent =
                    Math.round(joy);
                const avg = (hp + nrg + fd + joy) / 4;
                document.getElementById("vitalsPct").textContent =
                    Math.round(avg) + "%";
                const xp = p.experience || 0,
                    xpNext = p.experienceToNextLevel || 100,
                    xpPct = Math.min(100, (xp / xpNext) * 100);
                document.getElementById("xpValue").textContent =
                    "Bond " +
                    Math.round(p.bond || 0) +
                    " · XP " +
                    Math.round(xp) +
                    " / " +
                    Math.round(xpNext);
                document.getElementById("xpFill").style.width = xpPct + "%";
                updatePawLabels();
            }

            function openPaw() {
                /* paw print is always visible; no-op */
            }

            function closePaw() {
                /* paw print is always visible; no-op */
            }

            function getSpriteConfig(key) {
                const normalizedType =
                    { cat: "a", dog: "b", bird: "c" }[petData.type] ||
                    petData.type;
                if (normalizedType === "b" && key === "backflip") {
                    return SPRITE_CONFIG.b.backflip;
                }
                const petSprites =
                    SPRITE_CONFIG[normalizedType] || SPRITE_CONFIG.b;
                return petSprites[key] || SPRITE_CONFIG.b[key];
            }

            function restartIdleSprite() {
                const idleEl = document.getElementById("petIdle");
                if (!idleEl) return;
                idleEl.style.display = "";
                startSpriteAnim(idleEl, "idle", true);
            }

            function startSpriteAnim(element, key, loop = true) {
                const cfg = getSpriteConfig(key);
                if (!cfg || !element) return;
                stopSpriteAnim(element);
                element.style.backgroundImage = `url(${cfg.src})`;
                element.style.backgroundSize = `${cfg.cols * 100}% ${cfg.rows * 100}%`;
                element.classList.add("active");
                let frame = 0;
                const step = () => {
                    const col = frame % cfg.cols;
                    const row = Math.floor(frame / cfg.cols);
                    element.style.backgroundPosition = `${col * (100 / (cfg.cols - 1))}% ${row * (100 / (cfg.rows - 1))}%`;
                    frame++;
                    if (frame >= cfg.frames) {
                        if (loop) frame = 0;
                        else {
                            stopSpriteAnim(element);
                            return;
                        }
                    }
                };
                step();
                spriteIntervals.set(element, setInterval(step, 1000 / cfg.fps));
            }

            function stopSpriteAnim(element) {
                if (!element) return;
                const interval = spriteIntervals.get(element);
                if (interval) {
                    clearInterval(interval);
                    spriteIntervals.delete(element);
                }
                element.classList.remove("active");
            }

            const animQueue = [];
            let isAnimating = false;

            function playAnim(key) {
                const stats = ACTION_STATS[key];
                if (!stats) return;
                if ((petData.energy || 0) < stats.energy) {
                    showAlert(
                        "warning",
                        "Not enough energy to perform this action!",
                    );
                    return;
                }
                /* A fresh click replaces any older queued action. */
                animQueue.length = 0;
                if (isAnimating) {
                    const centerSprite =
                        document.getElementById("petCenterSprite");
                    if (centerSprite) stopSpriteAnim(centerSprite);
                    if (actionTimeout) {
                        clearTimeout(actionTimeout);
                        actionTimeout = null;
                    }
                    isAnimating = false;
                }
                animQueue.push(key);
                processAnimQueue();
            }

            function processAnimQueue() {
                if (isAnimating || animQueue.length === 0) return;
                isAnimating = true;
                const key = animQueue.shift();
                const stats = ACTION_STATS[key];
                petData.happiness = Math.min(
                    100,
                    Math.max(0, (petData.happiness || 0) + stats.happiness),
                );
                petData.energy = Math.max(0, petData.energy - stats.energy);
                petData.fullness = Math.min(
                    100,
                    Math.max(0, (petData.fullness || 0) + stats.fullness),
                );
                petData.experience = (petData.experience || 0) + stats.xp;
                if (
                    petData.experience >= (petData.experienceToNextLevel || 100)
                ) {
                    petData.level = (petData.level || 1) + 1;
                    petData.experience -= petData.experienceToNextLevel || 100;
                    petData.experienceToNextLevel =
                        (petData.experienceToNextLevel || 100) * 1.2;
                    showAlert(
                        "success",
                        "Level Up! Your pet is now level " + petData.level,
                    );
                }
                updateUI();
                savePetData();

                const idleEl = document.getElementById("petIdle");
                const centerSprite = document.getElementById("petCenterSprite");
                if (idleEl) {
                    idleEl.classList.remove("active");
                    idleEl.style.display = "none";
                }
                if (centerSprite) startSpriteAnim(centerSprite, key, false);
                const cfg = getSpriteConfig(key);
                const duration = Math.max(2500, (cfg.frames / cfg.fps) * 1000);
                if (actionTimeout) clearTimeout(actionTimeout);
                actionTimeout = setTimeout(() => {
                    closeAnim();
                }, duration);
            }

            function closeAnim() {
                const centerSprite = document.getElementById("petCenterSprite");
                if (centerSprite) stopSpriteAnim(centerSprite);
                if (actionTimeout) {
                    clearTimeout(actionTimeout);
                    actionTimeout = null;
                }
                isAnimating = false;
                restartIdleSprite();
                /* Process next animation in queue */
                if (animQueue.length > 0) {
                    setTimeout(() => processAnimQueue(), 500);
                }
            }

            function goBaseCamp() {
                window.location.href = "carepage.html";
            }
            function goCareCenter() {
                window.location.href = "vet.html";
            }
            function goNutrition() {
                window.location.href = "nutrition.html";
            }
            function goPark() {
                /* already here */
            }
            function openSetupModal() {
                window.location.href =
                    "carepage.html?addPet=1&return=park.html";
            }

            function showAlert(type, msg) {
                const ov = document.getElementById("alertOv");
                const em = document.getElementById("aEm");
                const ms = document.getElementById("aMsg");
                const icons = {
                    info: "??",
                    success: "?",
                    error: "?",
                    warning: "??",
                };
                em.textContent = icons[type] || icons.info;
                ms.textContent = msg;
                ov.style.display = "flex";
            }
            function closeAlert() {
                document.getElementById("alertOv").style.display = "none";
            }

            document.addEventListener("DOMContentLoaded", () => {
                const centerSprite = document.getElementById("petCenterSprite");
                const pawPetIdle = document.getElementById("pawPetIdle");
                const animSprite = document.getElementById("animSprite");
                if (centerSprite) centerSprite.style.backgroundImage = "none";
                if (pawPetIdle) pawPetIdle.style.backgroundImage = "none";
                if (animSprite) animSprite.style.backgroundImage = "none";
                document.getElementById("animSprite").style.display = "none";
                requestAnimationFrame(() => {
                    startSpriteAnim(
                        document.getElementById("petIdle"),
                        "idle",
                        true,
                    );
                });
                loadPetData();
                if (typeof helixNav !== "undefined") {
                    helixNav.init({
                        page: "park",
                        onPetSelect: (pid, pet) => {
                            currentPetId = pid;
                            petData = { ...petData, ...pet };
                            updateUI();
                            closeAnim();
                        },
                    });
                }
            });
        </script>
    </body>
